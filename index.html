<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopeCare - Together Against Cancer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <!-- Landing Section -->
    <section class="landing">
        <div class="banner-overlay"></div>
        <div class="landing-content">
            <h1 class="main-title">HopeCare</h1>
            <p class="main-message">Together, we can make a difference in the fight against cancer.</p>
        </div>
    </section>

    <!-- Quotes Section -->
    <section class="quotes-section">
        <div class="container">
            <h2 class="section-title fade-in-on-scroll">Words of Hope</h2>
            <div class="quote-container fade-in-on-scroll">
                <p class="quote-text" id="quoteText">Loading inspiration...</p>
                <p class="quote-author" id="quoteAuthor"></p>
            </div>
            <button class="quote-button" id="newQuoteBtn"><span>New Quote</span></button>
        </div>
    </section>

    <!-- Contact Form Section -->
    <section class="contact-section">
        <div class="container">
            <h2 class="section-title fade-in-on-scroll">Get in Touch</h2>
            <form class="contact-form fade-in-on-scroll" id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-button"><span>Send Message</span></button>
            </form>
            <div class="thank-you-message" id="thankYouMessage">
                <p>Thank you for reaching out! ✨</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
